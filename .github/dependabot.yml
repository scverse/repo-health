version: 2
# The github-actions and pre-commit ecosystems are both required by the dashboard's own
# `security/dependabot` check.
#
# Every ecosystem waits `cooldown.default-days` before proposing a new release. A
# compromised release is usually yanked within days, so not being first to upgrade is
# free protection — and nothing here is urgent enough to want same-day bumps. Security
# updates ignore the cooldown, so this does not delay fixes.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    groups:
      pre-commit:
        patterns: ["*"]
    cooldown:
      default-days: 7
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    cooldown:
      default-days: 7
