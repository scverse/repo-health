name: Audit exclusions

on:
  schedule:
    - cron: "43 5 1 * *" # 1st of the month, 05:43 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: audit-exclusions
  cancel-in-progress: false

env:
  ISSUE_TITLE: Unclassified repositories in the scverse organisation
  ISSUE_LABEL: repo-audit

jobs:
  audit:
    name: Check config/repos.yaml against the org listing
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out this repo
      issues: write # open, update or close the tracking issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Run the audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run repo-health audit-exclusions --markdown audit.md --exit-zero

      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create "$ISSUE_LABEL" --force --color ededed \
            --description "Repositories the dashboard does not yet classify"
          number=$(gh issue list --state open --label "$ISSUE_LABEL" --json number --jq '.[0].number // empty')
          if [ -s audit.md ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file audit.md
            else
              gh issue create --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body-file audit.md
            fi
          elif [ -n "$number" ]; then
            gh issue comment "$number" \
              --body "Every active org repository is now classified, included or excluded. Closing."
            gh issue close "$number"
          fi

  keepalive-job:
    # GitHub disables scheduled workflows in repositories with no activity for 60 days.
    name: Keepalive Workflow
    runs-on: ubuntu-latest
    permissions:
      actions: write # re-enable this workflow's own schedule
    steps:
      - name: Re-enable workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: sh
        run: gh api --verbose -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/audit-exclusions.yaml/enable"
