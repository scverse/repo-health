# Revisions are pinned to full commit SHAs, because this repo has to pass its own
# `security/precommit-pinned` check. The trailing comment records the human-readable tag.
fail_fast: false
default_language_version:
  python: python3
default_stages: [pre-commit, pre-push]
minimum_pre_commit_version: 3.0.0

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c  # frozen: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7  # frozen: v1.32.0
    hooks:
      - id: zizmor
        # The default persona would not have caught `undocumented-permissions`, so the
        # workflows would have drifted back to unexplained `write` scopes unnoticed.
        # `--no-progress` is the hook's own default arg, which `args:` would otherwise drop.
        args: [--no-progress, --persona=pedantic]
  - repo: https://github.com/biomejs/pre-commit
    rev: bc3c1d9acd69eaa1e5912f282ca563f914fd78d3  # frozen: v2.6.4
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@2.6.3"]
        files: ^src/scverse_repo_health/render/static/.*\.(js|css|json)$
  - repo: https://github.com/jolars/panache-pre-commit
    rev: v3.18.0
    hooks:
      - id: panache-format
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: 50e0f3aee9dc5747a5f173f79a7417403c18dda6  # frozen: v2.30.3
    hooks:
      - id: pyproject-fmt
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        exclude: ^\.github/workflows/  # GitHub Actions `on:` confuses the YAML 1.1 parser
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
