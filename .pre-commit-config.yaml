# Revisions are pinned to full commit SHAs, because this repo has to pass its own
# `security/precommit-pinned` check. The trailing comment records the human-readable tag.
fail_fast: false
default_language_version:
  python: python3
default_stages: [pre-commit, pre-push]
minimum_pre_commit_version: 3.0.0

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: aab412d509121cb5f7533134b7e67f9fab59c682 # v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 451b56af716f9f0d0c2b816503a3fd0cf8b036fa # v1.29.0
    hooks:
      - id: zizmor
        # The default persona would not have caught `undocumented-permissions`, so the
        # workflows would have drifted back to unexplained `write` scopes unnoticed.
        # `--no-progress` is the hook's own default arg, which `args:` would otherwise drop.
        args: [--no-progress, --persona=pedantic]
  - repo: https://github.com/biomejs/pre-commit
    rev: 055c65a8144b42a1f56908484127aec0c614fb85 # v2.5.10
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@2.5.10"]
        files: ^src/scverse_repo_health/render/static/.*\.(js|css|json)$
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: cc0b0f8d4107cfe80d6571644e639b05aee29128 # v2.28.1
    hooks:
      - id: pyproject-fmt
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        exclude: ^\.github/workflows/  # GitHub Actions `on:` confuses the YAML 1.1 parser
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

ci:
  autofix_prs: true
  autoupdate_schedule: monthly
